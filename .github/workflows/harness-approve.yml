name: Harness issue approval

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: askdoc-harness-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.repository == 'slcosentino1/AskDoc' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/harness approve') &&
      github.event.comment.author_association == 'OWNER' &&
      (contains(toJSON(github.event.issue.labels.*.name), 'agent:review') || contains(toJSON(github.event.issue.labels.*.name), 'agent:run'))
    runs-on:
      - self-hosted
      - macOS
      - askdoc-agent
    timeout-minutes: 180
    env:
      HARNESS_PYTHON: ${{ vars.HARNESS_PYTHON || 'python3' }}
      HARNESS_CODEX_CLI: ${{ vars.HARNESS_CODEX_CLI || 'codex' }}
      HARNESS_AILY_CLI: ${{ vars.HARNESS_AILY_CLI || 'aily' }}
      HARNESS_EXTRA_PATH: ${{ vars.HARNESS_EXTRA_PATH || '' }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_COMMENT_BODY: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
      HARNESS_GITHUB_ALLOWED_REPOSITORIES: slcosentino1/AskDoc

    steps:
      - name: Check out AskDoc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slcosentino1/AskDoc
          token: ${{ secrets.ASKDOC_CHECKOUT_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          path: AskDoc
          clean: false
          persist-credentials: false

      - name: Check out Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slcosentino1/autonomous-engineering-harness
          ref: main # use the merged Harness implementation
          path: autonomous-engineering-harness
          token: ${{ secrets.ASKDOC_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Resolve workflow ID from Harness proposal comment
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$PATH"
          if [ -n "$HARNESS_EXTRA_PATH" ]; then export PATH="$HARNESS_EXTRA_PATH:$PATH"; fi
          command -v "$HARNESS_PYTHON" >/dev/null
          command -v "$HARNESS_CODEX_CLI" >/dev/null
          command -v gh >/dev/null
          gh auth status --hostname github.com >/dev/null
          gh api --paginate --slurp "repos/slcosentino1/AskDoc/issues/$ISSUE_NUMBER/comments" > "$RUNNER_TEMP/issue-comments.json"
          "$HARNESS_PYTHON" - "$RUNNER_TEMP/issue-comments.json" "$GITHUB_OUTPUT" <<'PYTHON'
          import json
          import re
          import sys

          comments_path, output_path = sys.argv[1:]
          pages = json.load(open(comments_path, encoding="utf-8"))
          comments = [item for page in pages for item in page]
          marker = re.compile(r"<!-- harness-workflow:([A-Za-z0-9][A-Za-z0-9._-]{0,79}) -->")
          matches = set(marker.findall(__import__("os").environ.get("ISSUE_BODY", "")))
          for comment in comments:
              body = comment.get("body", "") if isinstance(comment, dict) else ""
              if isinstance(body, str):
                  matches.update(marker.findall(body))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Harness workflow marker on issue; found {len(matches)}.")
          workflow_id = next(iter(matches))
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"workflow_id={workflow_id}\n")
          PYTHON

      - name: Prepare approval conditions
        id: conditions
        shell: bash
        run: |
          set -euo pipefail
          "$HARNESS_PYTHON" - "$RUNNER_TEMP/approval-conditions.md" <<'PYTHON'
          import os
          import sys
          from pathlib import Path

          body = os.environ.get("ISSUE_COMMENT_BODY", "").replace("\r\n", "\n").replace("\r", "\n")
          lines = body.split("\n")
          if not lines or lines[0].strip() != "/harness approve":
              raise SystemExit("Approval comment must start with an exact '/harness approve' command.")
          conditions = "\n".join(lines[1:]).strip()
          if len(conditions) > 12_000:
              raise SystemExit("Approval conditions must not exceed 12,000 characters.")
          Path(sys.argv[1]).write_text(conditions + ("\n" if conditions else ""), encoding="utf-8")
          print(f"Approval conditions captured: {'yes' if conditions else 'no'}")
          PYTHON

      - name: Mark issue as implementation started
        shell: bash
        run: |
          set -euo pipefail
          gh label create "agent:implement" --color "1D76DB" --description "Harness implementation is running" --force
          gh api --method POST "repos/slcosentino1/AskDoc/issues/$ISSUE_NUMBER/labels" -f 'labels[]=agent:implement' >/dev/null
          gh api --method DELETE "repos/slcosentino1/AskDoc/issues/$ISSUE_NUMBER/labels/agent:review" >/dev/null || true
          gh api --method DELETE "repos/slcosentino1/AskDoc/issues/$ISSUE_NUMBER/labels/agent:run" >/dev/null || true

      - name: Approve proposal and run implementation
        id: harness_approve
        working-directory: ${{ github.workspace }}/autonomous-engineering-harness
        shell: bash
        env:
          WORKFLOW_ID: ${{ steps.resolve.outputs.workflow_id }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$PATH"
          if [ -n "$HARNESS_EXTRA_PATH" ]; then export PATH="$HARNESS_EXTRA_PATH:$PATH"; fi
          aily_path="$(command -v "$HARNESS_AILY_CLI")"
          aily_wrapper="$RUNNER_TEMP/aily-ci"
          printf '#!/bin/bash\nexec /usr/bin/env -u CI -u GITHUB_ACTIONS %q "$@"\n' "$aily_path" > "$aily_wrapper"
          chmod 700 "$aily_wrapper"
          export HARNESS_AILY_CLI="$aily_wrapper"
          "$HARNESS_PYTHON" harness/orchestrator.py approve \
            --target "$GITHUB_WORKSPACE/AskDoc" \
            --workflow-id "$WORKFLOW_ID" \
            --conditions-file "$RUNNER_TEMP/approval-conditions.md" \
            --codex "$HARNESS_CODEX_CLI" \
            --aily "$HARNESS_AILY_CLI"

      - name: Publish implementation status
        if: always() && steps.resolve.outputs.workflow_id != ''
        working-directory: ${{ github.workspace }}/autonomous-engineering-harness
        shell: bash
        env:
          WORKFLOW_ID: ${{ steps.resolve.outputs.workflow_id }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$PATH"
          if [ -n "$HARNESS_EXTRA_PATH" ]; then export PATH="$HARNESS_EXTRA_PATH:$PATH"; fi
          "$HARNESS_PYTHON" harness/orchestrator.py github report "$WORKFLOW_ID" --target "$GITHUB_WORKSPACE/AskDoc"

      - name: Mark issue complete
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh label create "agent:done" --color "0E8A16" --description "Harness workflow completed successfully" --force
          gh api --method POST "repos/slcosentino1/AskDoc/issues/$ISSUE_NUMBER/labels" -f 'labels[]=agent:done' >/dev/null
          gh api --method DELETE "repos/slcosentino1/AskDoc/issues/$ISSUE_NUMBER/labels/agent:implement" >/dev/null
